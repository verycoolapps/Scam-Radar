    <text x="94" y="333" fill="#4E7187" font-size="22" font-weight="600" letter-spacing="0.1">Kenali Tipu Daya. Selangkah Lebih Siap.</text>

    <line x1="94" y1="370" x2="628" y2="370" stroke="#C8D8D3" stroke-width="2"/>
    <text x="94" y="408" fill="#516977" font-size="13" font-weight="700" letter-spacing="1.25">GUIDANCE, NOT A LIVE SCANNER</text>
    <text x="94" y="435" fill="#516977" font-size="13" font-weight="700" letter-spacing="1.05">PANDUAN, BUKAN PEMINDAI LANGSUNG</text>
