  <path d="M0 505 C240 455 438 470 684 523" fill="none" stroke="#DCE7E2" stroke-width="2"/>
  <path d="M0 524 C233 476 432 489 638 535" fill="none" stroke="#E8EDE8" stroke-width="2"/>

