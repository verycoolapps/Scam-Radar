<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Scam Radar — See Through Deception. Stay One Step Ahead. / Kenali Tipu Daya. Selangkah Lebih Siap.</title>
  <desc id="banner-desc">Warm-white editorial banner with navy Scam Radar lettering and a navy shield containing teal radar rings, a blue signal, and amber accents. Tagline: “See Through Deception. Stay One Step Ahead.” / “Kenali Tipu Daya. Selangkah Lebih Siap.”</desc>
  <defs>
